{% set name = "ConfigArgParse" %}
{% set version = "1.7.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/C/{{ name }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: 607bea276a219912158afa1e5a716c3f8f88d542f9997dfd43bbd0b492a9f5a6

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<36]

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools
    - setuptools-scm
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - configargparse
  requires:
    - pyyaml
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests

about:
  home: https://github.com/bw2/ConfigArgParse
  summary: |
    Applications with more than a handful of user-settable options are best configured through a combination of command line args,
    config files, hard-coded defaults, and in some cases, environment variables.
  description: |
    Applications with more than a handful of user-settable options are best configured through a combination of command line args,
    config files, hard-coded defaults, and in some cases, environment variables. Python's command line parsing modules such as
    argparse have very limited support for config files and environment variables, so this module extends argparse to add these features.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/bw2/ConfigArgParse
  doc_url: https://bw2.github.io/ConfigArgParse

extra:
  recipe-maintainers:
    - msarahan
    - bollwyvl
